[project]
name = "movie-recap-myanmar"
version = "1.0.1"
description = "Turn movies into 3-minute Myanmar-language recap videos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "amkyawdev" }]

dependencies = [
    "flet>=1.1.0",
    "requests>=2.31.0",
    "edge-tts>=6.1.9",
]

[dependency-groups]
dev = [
    "flet-cli>=1.1.0",
    "flet-desktop>=1.1.0",
    "flet-web>=1.1.0",
]

[tool.flet]
org = "com.amkyawdev"
product = "Movie Recap Myanmar"
company = "amkyawdev"
copyright = "Copyright (c) 2026 amkyawdev"
build_number = 2

# Android adaptive-icon background. src/assets/icon.png is the source icon;
# this colour sits behind it where transparency cannot survive.
icon_background = "#0B0F14"

[tool.flet.app]
path = "src"

# Cross-platform permission bundles, expanded by flet-cli into the Android
# manifest. `photo_library` lets the user pick the movie to recap.
[tool.flet.android]
permissions = ["photo_library"]

[tool.ruff]
line-length = 100
target-version = "py310"
