[project]
name = "movie-recap-myanmar"
version = "1.0.0"
description = "Turn movies into 3-minute Myanmar-language recap videos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "amkyawdev" }]

dependencies = [
    "flet>=0.24.0",
    "requests>=2.31.0",
    "edge-tts>=6.1.9",
]

[project.optional-dependencies]
build = ["flet[all]>=0.24.0"]

[tool.flet]
app.path = "src"
app.assets_dir = "assets"
app.module = "main"
product = "Movie Recap Myanmar"
company = "amkyawdev"
copyright = "Copyright (c) 2026 amkyawdev"

[tool.flet.app]
name = "movie_recap_myanmar"
build_number = 1

[tool.flet.android]
package = "com.amkyawdev.movierecap"
adaptive_icon_background = "#0B0F14"

[tool.ruff]
line-length = 100
target-version = "py310"
