name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Flet Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]>=1.1.0" requests edge-tts

      # See release.yml: the CPython dist download inside
      # `serious_python_android:downloadDistArchive_<abi>` occasionally returns
      # a truncated body, which Gradle surfaces as a JSON parse error. Retry.
      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            echo "::group::flet build apk (attempt $attempt)"
            if flet build apk --project "Movie Recap Myanmar" --yes; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; retrying after a short backoff."
            sleep $((attempt * 30))
          done
          echo "flet build apk failed after 3 attempts" >&2
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-recap-myanmar-apk
          path: build/apk/**/*.apk
          if-no-files-found: warn
