name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]>=1.1.0" requests edge-tts

      # `flet build apk` fetches the CPython dist tarballs for every ABI from
      # the flet-dev/python-build GitHub release inside a Gradle task
      # (`serious_python_android:downloadDistArchive_<abi>`). That download is
      # occasionally truncated, which Gradle reports as an unrelated-looking
      # JSON parse error ("Unable to determine the current character"). It is
      # transient, so retry rather than fail the release.
      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            echo "::group::flet build apk (attempt $attempt)"
            if flet build apk --project "Movie Recap Myanmar" --yes; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; retrying after a short backoff."
            sleep $((attempt * 30))
          done
          echo "flet build apk failed after 3 attempts" >&2
          exit 1

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build/apk -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Movie Recap Myanmar ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Myanmar-language 3-minute movie recap studio.

            **Install:** download the APK below and sideload it
            (Settings → install unknown apps). Requires Android 7.0+.

            **Setup:** the app needs an `ASSEMBLYAI_API_KEY` for transcription
            and `ffmpeg` on device for rendering.
